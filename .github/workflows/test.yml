name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Node LTS lines that are still maintained.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn test:mocha
      - run: yarn test:tsc
      - run: yarn test:lint
      - run: yarn test:prettier
      - run: yarn prepublishOnly
      - run: yarn test:smoke
      - run: yarn docs:build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-changes
          path: test/output/*-changed.*
