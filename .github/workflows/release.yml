# Publishes @dave-hillier/replot to npm when a v* tag is pushed.
#
# Authentication is npm OIDC "trusted publishing": no NPM_TOKEN secret is
# involved. GitHub mints a short-lived id-token for this workflow, npm verifies
# it against the trusted publisher configured for the package, and the publish
# is recorded with provenance.
#
# Prerequisites, which must be done by hand on npmjs.com and can only be done
# once the package exists:
#
#   1. The very first publish must be manual (`npm publish` from a logged-in
#      shell). A trusted publisher can only be attached to a package that is
#      already on the registry, so there is no way to bootstrap this from CI.
#   2. On npmjs.com go to the package -> Settings -> Trusted publishing, and add
#      a GitHub Actions publisher for repository `dave-hillier/replot` with
#      workflow filename `release.yml`. The filename must match this file's
#      name exactly; renaming this file breaks publishing until the trusted
#      publisher is updated to match.
#   3. Keep the npm CLI recent (>= 11.5.1); older versions do not support OIDC.
#
# The dist-tag comes from publishConfig.tag in package.json, defaulting to
# `latest`. It is passed to npm explicitly rather than left implicit: npm 10
# ignores publishConfig.tag and resolves `latest` regardless.
#
# After publishing, the workflow creates the GitHub release for the tag, with
# the matching CHANGELOG.md section as its notes. Both the version check and
# the notes are taken before publishing, so a tag that disagrees with
# package.json, or has no changelog section, fails without publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: "https://registry.npmjs.org"
      # prepublishOnly runs `yarn bundle`, so yarn must be on PATH for npm publish.
      - run: corepack enable
      - run: npm install -g npm@latest
      - run: yarn --frozen-lockfile
      - run: yarn test
      # The release notes are the CHANGELOG.md section headed with the version.
      - name: Check the version and extract the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          awk -v heading="## $version" '$0 == heading {found=1; next} found && /^## / {exit} found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no section headed '## $version'" >&2
            exit 1
          fi
      # package.json stays the single source of truth for the dist-tag; reading
      # it here just stops npm from silently falling back to `latest`.
      - id: disttag
        run: |
          tag=$(node -p "require('./package.json').publishConfig?.tag || 'latest'")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm publish --tag "${{ steps.disttag.outputs.tag }}"
      # A version with a prerelease suffix, such as 1.0.0-rc.1, is marked as a
      # prerelease on GitHub too.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease
