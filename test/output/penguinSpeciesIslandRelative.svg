      <text transform="translate(40,400)" y="0.32em">0</text>
      <text transform="translate(40,362)" y="0.32em">10</text>
      <text transform="translate(40,324)" y="0.32em">20</text>
      <text transform="translate(40,286)" y="0.32em">30</text>
      <text transform="translate(40,248)" y="0.32em">40</text>
      <text transform="translate(40,210)" y="0.32em">50</text>
      <text transform="translate(40,172)" y="0.32em">60</text>
      <text transform="translate(40,134)" y="0.32em">70</text>
      <text transform="translate(40,96)" y="0.32em">80</text>
      <text transform="translate(40,58)" y="0.32em">90</text>
      <text transform="translate(40,20)" y="0.32em">100</text>
    </g>
  </g>
  <g aria-label="y-axis label" text-anchor="start" transform="translate(-36.5,-16.5)">
    <text transform="translate(40,20)" y="0.71em">↑ Frequency (%)</text>
  </g>
  <g aria-label="bar">
    <g transform="translate(0,0)">
      <rect fill="#4269d0" x="40" y="290" width="180" height="110"></rect>
      <rect fill="#efb118" x="40" y="150" width="180" height="140"></rect>
      <rect fill="#ff725c" x="40" y="20" width="180" height="130"></rect>
    </g>
    <g transform="translate(200,0)">
      <rect fill="#efb118" x="40" y="20" width="180" height="380"></rect>
    </g>
    <g transform="translate(400,0)">
      <rect fill="#4269d0" x="40" y="20" width="180" height="380"></rect>
    </g>
  </g>
  <g aria-label="rule" transform="translate(0,0.5)">
    <g stroke="currentColor" transform="translate(0,0)">
      <line x1="40" x2="220" y1="400" y2="400"></line>
    </g>
    <g stroke="currentColor" transform="translate(200,0)">
      <line x1="40" x2="220" y1="400" y2="400"></line>
