<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="430" viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="fx-axis tick" aria-hidden="true" transform="translate(0.5,0)">
    <g fill="none" stroke="currentColor" transform="translate(0,0)">
      <path transform="translate(130,400)" d="M0,0L0,6"></path>
    </g>
    <g fill="none" stroke="currentColor" transform="translate(200,0)">
      <path transform="translate(130,400)" d="M0,0L0,6"></path>
    </g>
    <g fill="none" stroke="currentColor" transform="translate(400,0)">
      <path transform="translate(130,400)" d="M0,0L0,6"></path>
    </g>
  </g>
  <g aria-label="fx-axis tick label" transform="translate(0.5,9.5)">
    <g transform="translate(0,0)">
      <text transform="translate(130,400)" y="0.71em">Adelie</text>
    </g>
    <g transform="translate(200,0)">
      <text transform="translate(130,400)" y="0.71em">Chinstrap</text>
    </g>
    <g transform="translate(400,0)">
      <text transform="translate(130,400)" y="0.71em">Gentoo</text>
    </g>
  </g>
  <g aria-label="fx-axis label" transform="translate(0.5,27.5)">
    <text transform="translate(330,400)">species</text>
  </g>
  <g aria-label="y-axis tick" aria-hidden="true" transform="translate(0,0.5)">
    <g fill="none" stroke="currentColor" transform="translate(0,0)">
      <path transform="translate(40,400)" d="M0,0L-6,0"></path>
      <path transform="translate(40,362)" d="M0,0L-6,0"></path>
      <path transform="translate(40,324)" d="M0,0L-6,0"></path>
      <path transform="translate(40,286)" d="M0,0L-6,0"></path>
      <path transform="translate(40,248)" d="M0,0L-6,0"></path>
      <path transform="translate(40,210)" d="M0,0L-6,0"></path>
      <path transform="translate(40,172)" d="M0,0L-6,0"></path>
      <path transform="translate(40,134)" d="M0,0L-6,0"></path>
      <path transform="translate(40,96)" d="M0,0L-6,0"></path>
      <path transform="translate(40,58)" d="M0,0L-6,0"></path>
      <path transform="translate(40,20)" d="M0,0L-6,0"></path>
    </g>
  </g>
  <g aria-label="y-axis tick label" transform="translate(-8.5,0.5)">
