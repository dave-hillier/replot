<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="90" viewBox="0 0 640 90" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="x-axis tick" aria-hidden="true" fill="none" stroke="currentColor" transform="translate(0.5,0)">
    <path transform="translate(20,60)" d="M0,0L0,6"></path>
    <path transform="translate(80,60)" d="M0,0L0,6"></path>
    <path transform="translate(140,60)" d="M0,0L0,6"></path>
    <path transform="translate(200,60)" d="M0,0L0,6"></path>
    <path transform="translate(260,60)" d="M0,0L0,6"></path>
    <path transform="translate(320,60)" d="M0,0L0,6"></path>
    <path transform="translate(380,60)" d="M0,0L0,6"></path>
    <path transform="translate(440,60)" d="M0,0L0,6"></path>
    <path transform="translate(500,60)" d="M0,0L0,6"></path>
    <path transform="translate(560,60)" d="M0,0L0,6"></path>
    <path transform="translate(620,60)" d="M0,0L0,6"></path>
  </g>
  <g aria-label="x-axis tick label" font-variant="tabular-nums" transform="translate(0.5,9.5)">
    <text transform="translate(20,60)" y="0.71em">0.0</text>
    <text transform="translate(80,60)" y="0.71em">0.1</text>
    <text transform="translate(140,60)" y="0.71em">0.2</text>
    <text transform="translate(200,60)" y="0.71em">0.3</text>
    <text transform="translate(260,60)" y="0.71em">0.4</text>
    <text transform="translate(320,60)" y="0.71em">0.5</text>
    <text transform="translate(380,60)" y="0.71em">0.6</text>
    <text transform="translate(440,60)" y="0.71em">0.7</text>
    <text transform="translate(500,60)" y="0.71em">0.8</text>
    <text transform="translate(560,60)" y="0.71em">0.9</text>
    <text transform="translate(620,60)" y="0.71em">1.0</text>
  </g>
  <g aria-label="tip" fill="var(--plot-background)" stroke="currentColor" text-anchor="start" transform="translate(0.5,0.5)" visibility="hidden">
    <g transform="translate(320,60)">
      <path filter="drop-shadow(0 3px 4px rgba(0,0,0,0.2))" d="M0,0l6,-6h36.5v-36h-85v36h36.5z"></path>
      <text fill="currentColor" fill-opacity="1" stroke="none" y="-2.29em" transform="translate(-34.5,-14)"><tspan x="0" dy="1em">​<tspan font-weight="bold">low–high</tspan> 0–1</tspan><tspan x="0" dy="1em">​<tspan font-weight="bold">fill</tspan> 0<tspan fill="rgb(149, 251, 81)" style="user-select: none;"> ■</tspan></tspan></text>
    </g>
  </g>
</svg>