<svg class="plot" fill="currentColor" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" width="640" height="110" viewBox="0 0 640 110" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    :where(.plot) {
      --plot-background: white;
      display: block;
      height: auto;
      height: intrinsic;
      max-width: 100%;
    }

    :where(.plot text),
    :where(.plot tspan) {
      white-space: pre;
    }
  </style>
  <g aria-label="fx-axis tick label" transform="translate(0.5,-8.5)">
    <g transform="translate(1,0)">
      <text transform="translate(162,30)">2001</text>
    </g>
    <g transform="translate(316,0)">
      <text transform="translate(162,30)">2002</text>
    </g>
  </g>
  <g aria-label="fx-axis label" transform="translate(0.5,-26.5)">
    <text transform="translate(320.5,30)" y="0.71em">Year</text>
  </g>
  <g aria-label="x-axis tick" aria-hidden="true" transform="translate(0.5,0)">
    <g fill="none" stroke="currentColor" transform="translate(1,0)">
      <path transform="translate(162,80)" d="M0,0L0,6"></path>
    </g>
    <g fill="none" stroke="currentColor" transform="translate(316,0)">
      <path transform="translate(162,80)" d="M0,0L0,6"></path>
    </g>
  </g>
  <g aria-label="x-axis tick label" transform="translate(0.5,9.5)">
    <g font-variant="tabular-nums" transform="translate(1,0)">
      <text transform="translate(162,80)" y="0.71em">0</text>
    </g>
    <g font-variant="tabular-nums" transform="translate(316,0)">
      <text transform="translate(162,80)" y="0.71em">0</text>
    </g>
  </g>
  <g aria-label="tip" transform="translate(0.5,0.5)">
    <g fill="var(--plot-background)" stroke="currentColor" text-anchor="start" transform="translate(1,0)" visibility="hidden">
      <g transform="translate(162,80)">
        <path filter="drop-shadow(0 3px 4px rgba(0,0,0,0.2))" d="M0,0l6,-6h29.5v-36h-71v36h29.5z"></path>
        <text fill="currentColor" fill-opacity="1" stroke="none" y="-2.29em" transform="translate(-27.5,-14)"><tspan x="0" dy="1em">​<tspan font-weight="bold">x</tspan> 0</tspan><tspan x="0" dy="1em">​<tspan font-weight="bold">Year</tspan> 2001</tspan></text>
      </g>
    </g>
    <g fill="var(--plot-background)" stroke="currentColor" text-anchor="start" transform="translate(316,0)" visibility="hidden">
      <g transform="translate(162,80)">
        <path filter="drop-shadow(0 3px 4px rgba(0,0,0,0.2))" d="M0,0l6,-6h30v-36h-72v36h30z"></path>
        <text fill="currentColor" fill-opacity="1" stroke="none" y="-2.29em" transform="translate(-28,-14)"><tspan x="0" dy="1em">​<tspan font-weight="bold">x</tspan> 0</tspan><tspan x="0" dy="1em">​<tspan font-weight="bold">Year</tspan> 2002</tspan></text>
      </g>
    </g>
  </g>
</svg>